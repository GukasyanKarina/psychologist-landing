  </defs>
  <rect width="480" height="600" fill="url(#heroBg)"/>

  <!-- arch niche -->
  <path d="M 130 600 L 130 320 C 130 230, 190 180, 240 180 C 290 180, 350 230, 350 320 L 350 600 Z"
