  <ellipse cx="270" cy="300" rx="9" ry="20" transform="rotate(25 270 300)" fill="#7c7b4d"/>
  <ellipse cx="200" cy="350" rx="8" ry="18" transform="rotate(-35 200 350)" fill="#7c7b4d"/>
